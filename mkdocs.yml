site_name: Aplicacions Ofimàtiques · 1r SMX
site_description: Mòdul 0223 · Aplicacions Ofimàtiques · 1r SMX · Curs 2026-2027
site_author: Samuel Viel Malonda
# ── CANVIA ACÍ el teu usuari de GitHub i el nom del repositori ──────────
site_url: https://samuelviel.github.io/AOF_SMX_2627/
repo_url: https://github.com/samuelviel/AOF_SMX_2627
repo_name: AOF_SMX_2627
edit_uri: edit/main/docs/
copyright: © 2026-2027 Samuel Viel Malonda · CC BY-SA 4.0

theme:
  name: material
  language: ca
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Mode clar
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tooltips

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/samuelviel
  generator: false

plugins:
  - search:
      lang: es

